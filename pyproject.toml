[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ajc-cv-matching-public"
version = "1.0.0"
description = "Public deterministic reconstruction of a large-scale CV processing and matching POC."
requires-python = ">=3.11"
readme = "README.md"
authors = [{name = "Fred Zanghi"}]

[project.scripts]
ajc-cv-matching = "ajc_cv_matching.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
